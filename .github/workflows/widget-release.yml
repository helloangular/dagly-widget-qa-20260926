name: widget catalog release
run-name: ${{ inputs.helio_execution_id }}
'on':
  workflow_dispatch:
    inputs:
      helio_execution_id:
        type: string
        required: false
        default: ''
        description: Helio execution id, echoed exactly as the run name when supplied
      helio_target_environment:
        type: string
        required: false
        default: ''
        description: Empty for normal fan-out; exact catalog key for deployment-only recovery
  push:
    branches:
    - master
permissions:
  contents: write
  packages: write
jobs:
  artifact:
    name: Artifact
    uses: jquantum-helio-qa/dagly-helio-platform-qa-20260926/.github/workflows/catalog-build.yml@dc55171d5811f60bd7c4c181b427d4cb3d2fbdc6
    with:
      helio_execution_id: ${{ inputs.helio_execution_id || '' }}
      helio_target_environment: ${{ inputs.helio_target_environment || '' }}
      build_runner: '["self-hosted","dagly-live-widget"]'
      image_repository: localhost:5001/dagly-widget-qa-20260926
      build_adapter: cicd/helio-build.sh
      material_lock: cicd/helio-materials.lock.json
      deploy_settings_keys: '["AWS_PROFILE","DEPLOY_ENV","DEPLOY_REGION","GO_PIPELINE_NAME","INVENTORY_GROUP","INVENTORY_SCRIPT","PLAYBOOK"]'
      secret_names: '["DOCKER_HUB_TOKEN","GH_APP_BUILD_AGENT_CLIENT_ID","GH_APP_BUILD_AGENT_PRIVATE_KEY","NEXUS_DOCKER_PASSWORD","NEXUS_NPM_PASSWORD","NEXUS_PYPI_PASSWORD","NEXUS_YUM_PASSWORD","SONAR_TOKEN"]'
    secrets: inherit
  deploy:
    name: Deploy
    needs:
    - artifact
    uses: jquantum-helio-qa/dagly-helio-platform-qa-20260926/.github/workflows/catalog-deploy.yml@dc55171d5811f60bd7c4c181b427d4cb3d2fbdc6
    with:
      helio_execution_id: ${{ inputs.helio_execution_id || '' }}
      helio_target_environment: ${{ inputs.helio_target_environment || '' }}
      deploy_adapter: cicd/helio-deploy.sh
      deploy_settings_keys: '["AWS_PROFILE","DEPLOY_ENV","DEPLOY_REGION","GO_PIPELINE_NAME","INVENTORY_GROUP","INVENTORY_SCRIPT","PLAYBOOK"]'
      secret_names: '[]'
    secrets: inherit
  release-notes:
    name: Release notes
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs:
    - deploy
    runs-on:
    - self-hosted
    - dagly-live-widget
    steps:
    - name: Publish release notes
      shell: bash
      run: echo "release notes for ${GITHUB_SHA}"
